[project]
name = "scrapeMM"
version = "1.0.2"
description = "Multimodal scraper for social media, internet archives, and the open web."
readme = "README.md"
requires-python = "<3.15,>=3.10"
license = "Apache-2.0"
authors = [{name = "Mark Rothermel", email = "mark.rothermel@tu-darmstadt.de"}]

# This package is the scrapeMM *client*. It talks to a scrapeMM server over HTTP and
# does no scraping itself, so it needs none of the scraping stack. The server ships as
# a Docker image built from this repo; its dependencies live in requirements-server.txt.
dependencies = [
    "aiohttp~=3.14.3",
    "ezmm~=0.5.2",
    "tqdm~=4.70.1",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/multimodal-ai-lab/scrapeMM"
Issues = "https://github.com/multimodal-ai-lab/scrapeMM"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = false  # Disable implicit namespaces
# The published package is the client. The server is not merely undeclared here -- its
# code is kept out of the distribution altogether, so `pip install scrapeMM` cannot put
# a half-usable scraping stack on anybody's machine. The server runs from this repo, as
# the Docker image does.
exclude = ["scrapemm.server*", "testing*", "scripts*", "ui*", "docker*"]

[tool.setuptools.package-data]
"*" = ["*.txt"]  # Include all .txt files contained in any (sub)package in the build

[tool.pytest.ini_options]
testpaths = [
    "testing/",
]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "server: tests that need the server dependencies (requirements-server.txt)",
]
